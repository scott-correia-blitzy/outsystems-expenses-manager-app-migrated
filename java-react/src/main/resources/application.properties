spring.application.name=expenses-manager
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/expenses
spring.h2.console.enabled=false
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

server.servlet.session.timeout=20m
server.servlet.session.cookie.same-site=lax
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Lets the 413 error body reach the client when an upload exceeds the limit.
server.tomcat.max-swallow-size=-1

expenses.mileage-reimbursement=0.37
expenses.dollars-to-euros=0.93
expenses.vat-rate=0.23
# Pins the month and 30-day dashboard figures to the seeded data; leave blank to use today.
expenses.dashboard.reference-date=2024-05-23
expenses.remember-me-days=30
expenses.seed.enabled=true

# These print session ids, entity fields and request values at DEBUG, so they stay at INFO under a raised root or package level.
logging.level.org.springframework.security.web.authentication.logout.SecurityContextLogoutHandler=INFO
logging.level.org.hibernate.internal.util.EntityPrinter=INFO
logging.level.org.springframework.web.method.HandlerMethod=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO
